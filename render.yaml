# Render Blueprint specification for Niveshak AI
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: niveshak-ai
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: data/cache.db
      - key: DEBUG
        value: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
